[project]
name = "deupack"
version = "0.0.1"
description = "Python package to calculate structure of the deuteron"
authors = [
  {name = "Adam Freese", email = "afreese@jlab.org"},
  {name = "Alan Sosa"}
]
maintainers = [
  {name = "Adam Freese", email = "afreese@jlab.org"}
]
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "scipy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/adamfreese/deupack.git"
Repository = "https://github.com/adamfreese/deupack.git"
